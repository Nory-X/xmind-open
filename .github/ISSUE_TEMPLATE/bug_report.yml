name: Bug report
description: Something is not working as expected
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in as much as you can —
        "it doesn't work" is very difficult to act on.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, and paste the exact wording of any error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click on ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: e.g. 1.9.10
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: XMind Open version
      placeholder: e.g. 1.3.0
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Preview and opening behaviour
      description: |
        Does the file show a preview image, only the fallback icon, or nothing at all?
        If it opens in the wrong program (or none), paste what the **Auto-detect** button reports.
    validations:
      required: false
